[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csmarket-research"
version = "0.3.0"
description = "A reproducible study of CS2 case expected value and market pricing"
readme = "README.md"
requires-python = ">=3.11"
# Skinport requires Brotli-encoded responses, and requests only negotiates
# `br` when a Brotli backend is installed, so this is a hard dependency
# rather than an optional extra.
dependencies = ["requests>=2.31,<3", "brotli>=1.1"]

[project.urls]
Homepage = "https://wrtzkevin-collab.github.io/csmarket-research/"
Repository = "https://github.com/wrtzkevin-collab/csmarket-research"
Methodology = "https://github.com/wrtzkevin-collab/csmarket-research/blob/main/docs/METHODOLOGY.md"

[project.scripts]
csmarket = "csmarket.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
